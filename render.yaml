services:
  - type: web
    name: jobsauto
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ADMIN_TOKEN
        generateValue: true
      - key: DATABASE_PATH
        value: /tmp/jobsauto.db
